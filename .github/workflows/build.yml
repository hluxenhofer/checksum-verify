name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release -- --report-gh --report-html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: ignore

  publish:
    # Smoke-test the release publish step on every change (installer itself is built in release.yml).
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Publish self-contained
        run: >
          dotnet publish src/ChecksumVerify/ChecksumVerify.csproj
          -c Release -r win-x64 --self-contained
          -o publish/win-x64/

      - name: Verify resources.pri was published
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/win-x64/resources.pri")) {
            Write-Error "resources.pri missing from publish output"
            exit 1
          }
