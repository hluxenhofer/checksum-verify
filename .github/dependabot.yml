version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      xunit-and-testing:
        patterns: ["xunit*", "Microsoft.Testing.*"]
      windows-app-sdk:
        patterns: ["Microsoft.WindowsAppSDK*", "Microsoft.Windows.SDK.BuildTools*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
